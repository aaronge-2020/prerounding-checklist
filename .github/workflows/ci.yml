name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit and boundary checks
            command: npm run lint && npm run test:unit
            browser: false
          - name: Guided demo browser
            command: npm run test:guided-demo-browser
            browser: true
          - name: Primary note pull browser
            command: npm run test:primary-note-pull-fallback
            browser: true
          - name: Vault and import browser
            command: node tests/test-note-drag-browser.js && node tests/test-local-first-ui-browser.js
            browser: true
          - name: Epic import layout and corpus
            command: node tests/test-epic-import-layout-browser.js && node tests/test-structured-note-scroll-browser.js && node tests/test-epic-import-corpus-browser.js
            browser: true
          - name: Note writing browser
            command: node tests/test-review-data-browser.js
            browser: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: matrix.browser
        run: npx playwright install --with-deps chromium

      - name: Run targeted CI checks
        run: ${{ matrix.command }}

<!doctype html>
<html><head><meta charset="utf-8"><title>debug</title></head><body>
<script type="module">
import * as transformers from "./vendor/transformers-web.js";
window.__dbg = async (text) => {
  const base = new URL("./", location.href).href;
  transformers.env.allowLocalModels = true;
  transformers.env.allowRemoteModels = true;
  transformers.env.localModelPath = new URL("models/", base).href;
  const nativeFetch = fetch.bind(globalThis);
  transformers.env.fetch = async (input, init) => {
    const raw = typeof input === "string" ? input : input.url;
    const m = /^https:\/\/huggingface\.co\/([^/]+\/[^/]+)\/resolve\/[^/]+\/(.+)$/.exec(raw);
    if (m) return nativeFetch(new URL(`models/${m[1]}/${m[2]}`, base), init);
    return nativeFetch(input, init);
  };
  transformers.env.useBrowserCache = false;
  if (transformers.env.backends?.onnx?.wasm) {
    transformers.env.backends.onnx.wasm.wasmPaths = {
      mjs: new URL("vendor/ort-wasm-simd-threaded.asyncify.mjs", base).href,
      wasm: new URL("vendor/ort-wasm-simd-threaded.asyncify.wasm", base).href
    };
    transformers.env.backends.onnx.wasm.proxy = false;
  }
  const MODEL_ID = "onnx-community/piiranha-v1-detect-personal-information-ONNX";
  const tok = await transformers.AutoTokenizer.from_pretrained(MODEL_ID);
  const model = await transformers.AutoModelForTokenClassification.from_pretrained(MODEL_ID, { dtype: "q8", local_files_only: true });
  const inputs = await tok(text, { return_tensors: true });
  const { logits } = await model(inputs);
  const sm = (arr) => { const m = Math.max(...arr); const e = arr.map((x) => Math.exp(x - m)); const s = e.reduce((a, b) => a + b, 0); return e.map((x) => x / s); };
  const scores = logits.tolist()[0].map(sm);
  const id2label = model.config.id2label;
  const argmax = scores.map((s) => s.indexOf(Math.max(...s)));
  const tokens = tok.decode ? null : null;
  return {
    tokens: Array.from(inputs.input_ids.data),
    predicted: argmax.map((i, k) => id2label[i] + ":" + scores[k][i].toFixed(3))
  };
};
window.__dbgReady = true;
</script>
</body></html>

<!doctype html><html><body><div id="r">pending</div>
<script type="module">
// Verbatim replica of @mlc-ai/web-llm@0.2.85 detectGPUDevice() (lib/index.js:4109),
// the exact gate inside MLCEngine.reload() before any model bytes are used.
async function detectGPUDevice(powerPreference = "high-performance") {
  if (typeof navigator !== "undefined" && navigator.gpu !== undefined) {
    const adapter = await navigator.gpu.requestAdapter({ powerPreference });
    if (adapter == null) {
      throw Error("Unable to find a compatible GPU. This issue might be because your computer doesn't have a GPU, or your system settings are not configured properly. " +
        "Please check if your device has a GPU properly set up and if your your browser supports WebGPU. " +
        "You can also consult your browser's compatibility chart to see if it supports WebGPU. " +
        "For more information about WebGPU support in your browser, visit https://webgpureport.org/");
    }
    return adapter;
  }
  throw Error("navigator.gpu is not available");
}
try {
  await detectGPUDevice();
  document.getElementById("r").textContent = "OK: adapter acquired";
} catch (e) {
  document.getElementById("r").textContent = "WEBLLM WOULD THROW: " + String(e.message).slice(0, 260);
}
</script></body></html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>deid ensemble harness — round 2</title></head>
<body>
<script type="module">
// Round-2 ensemble probe (report only, not shipped): loads the Stanford
// default model AND the best RoBERTa candidate, runs each text through the
// actual shipped pipeline (re-synced deid.bundle.js) in hybrid mode with each
// model, and unions the entity spans. Latency is the sum of both passes.
import * as transformers from "./vendor/transformers-web.js";
import { createDeidentifier } from "./src/vault/deid.bundle.js";

// ?a=<org/name>&dtypeA=<q>&b=<org/name>&dtypeB=<q>; defaults are the two
// ensemble members.
const q = new URL(location.href).searchParams;
const MODEL_A = q.get("a") || "onnx-community/stanford-deidentifier-base-ONNX";
const MODEL_B = q.get("b") || "thinkingface/deid_roberta_i2b2_q";
const DTYPE_A = q.get("dtypeA") || "q8";
const DTYPE_B = q.get("dtypeB") || "q8";

const deids = [];

async function loadOne(modelId, dtype) {
  const base = new URL("./", location.href).href;
  transformers.env.allowLocalModels = true;
  transformers.env.allowRemoteModels = true;
  transformers.env.localModelPath = new URL("models/", base).href;
  const nativeFetch = fetch.bind(globalThis);
  transformers.env.fetch = async (input, init) => {
    const raw = typeof input === "string" ? input : input.url;
    const m = /^https:\/\/huggingface\.co\/(.+)\/resolve\/[^/]+\/(.+)$/.exec(raw);
    if (m) return nativeFetch(new URL(`models/${m[1]}/${m[2]}`, base), init);
    // App parity (deid-service.js localOnlyModelFetch): transformers.js treats
    // multi-segment app model ids (Wismut/openmed-onnx/small) as relative
    // probe paths; the app resolves those against the model base, not the
    // page. Same here.
    const modelsBase = new URL("models/", base);
    const u = new URL(raw, modelsBase.href);
    if (u.origin === modelsBase.origin && u.href.startsWith(modelsBase.href)) return nativeFetch(u, init);
    return nativeFetch(input, init);
  };
  transformers.env.useBrowserCache = false;
  if (transformers.env.backends?.onnx?.wasm) {
    transformers.env.backends.onnx.wasm.wasmPaths = {
      mjs: new URL("vendor/ort-wasm-simd-threaded.asyncify.mjs", base).href,
      wasm: new URL("vendor/ort-wasm-simd-threaded.asyncify.wasm", base).href
    };
    transformers.env.backends.onnx.wasm.proxy = false;
  }
  const d = createDeidentifier({
    pipelineFactory: (task, id, options) => transformers.pipeline(task, id, options),
    mode: "hybrid",
    modelCandidates: [
      {
        modelId,
        options: { dtype, local_files_only: true },
        inferenceOptions: { aggregation_strategy: "simple" }
      }
    ]
  });
  await d.loadModel();
  return d;
}

async function load() {
  const t0 = performance.now();
  deids.push(await loadOne(MODEL_A, DTYPE_A));
  deids.push(await loadOne(MODEL_B, DTYPE_B));
  // Warm-up so benchmark timings exclude one-time session setup.
  for (const d of deids) {
    await d.deidentifyText("Warm up. Jane Smith, 555-0100.", { mode: "hybrid" });
  }
  const mem = performance.memory ? {
    usedJSHeapSizeMB: +(performance.memory.usedJSHeapSize / 1048576).toFixed(1),
    totalJSHeapSizeMB: +(performance.memory.totalJSHeapSize / 1048576).toFixed(1)
  } : null;
  return {
    ms: performance.now() - t0,
    models: [MODEL_A, MODEL_B],
    memoryAfterLoad: mem
  };
}

function unionEntities(lists) {
  // Dedupe by character offset alone: the binary exact-span scorer collapses
  // duplicate (start,end) pairs anyway, so the union keeps one entity per
  // span — the higher model score wins, first-seen wins ties.
  const seen = new Map(); // "start:end" -> entity
  for (const list of lists) {
    for (const e of list) {
      const k = `${e.start}:${e.end}`;
      const prev = seen.get(k);
      if (!prev || (typeof e.score === "number" && (typeof prev.score !== "number" || e.score > prev.score))) {
        seen.set(k, e);
      }
    }
  }
  return [...seen.values()].sort((a, b) => a.start - b.start || a.end - b.end);
}

async function run(texts, mode) {
  const out = [];
  for (const text of texts) {
    const t0 = performance.now();
    const perModelMs = [];
    const lists = [];
    for (const d of deids) {
      const m0 = performance.now();
      const result = await d.deidentifyText(text, { mode: "hybrid" });
      perModelMs.push(performance.now() - m0);
      lists.push((result.entities || []).map((e) => ({
        start: e.start,
        end: e.end,
        label: e.label,
        score: typeof e.score === "number" ? e.score : null,
        source: e.source || null
      })));
    }
    out.push({
      ms: performance.now() - t0,
      msA: perModelMs[0],
      msB: perModelMs[1],
      entities: unionEntities(lists)
    });
  }
  return out;
}

window.__bench = { load, run };
window.__benchReady = true;
</script>
</body>
</html>
